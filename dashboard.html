<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XAUUSD Auto Trader</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0e17;--card:#111827;--border:#1e293b;--text:#e2e8f0;--dim:#64748b;--green:#22c55e;--red:#ef4444;--blue:#3b82f6;--yellow:#eab308;--cyan:#06b6d4;--purple:#a855f7;--orange:#f97316}
[data-theme="light"]{--bg:#f1f5f9;--card:#ffffff;--border:#e2e8f0;--text:#1e293b;--dim:#64748b;--green:#16a34a;--red:#dc2626;--blue:#2563eb;--yellow:#ca8a04;--cyan:#0891b2;--purple:#9333ea;--orange:#ea580c}
.theme-btn{background:none;border:1px solid var(--border);border-radius:6px;padding:4px 10px;cursor:pointer;font-size:14px;color:var(--text);transition:all .15s}
.theme-btn:hover{background:var(--border)}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;font-size:13px;padding:10px 12px}
.grid{display:grid;gap:8px;margin-bottom:8px}
.g3{grid-template-columns:1fr 1fr 1fr}.g2{grid-template-columns:1fr 1fr}.g4{grid-template-columns:1fr 1fr 1fr 1fr}
.card{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:10px}
.card h3{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--dim);margin-bottom:6px}
.big{font-size:26px;font-weight:700;letter-spacing:-1px}
.row{display:flex;justify-content:space-between;padding:2px 0;border-bottom:1px solid var(--border)}
.row:last-child{border:none}
.label{color:var(--dim)}
.green{color:var(--green)}.red{color:var(--red)}.blue{color:var(--blue)}.yellow{color:var(--yellow)}.cyan{color:var(--cyan)}.purple{color:var(--purple)}.orange{color:var(--orange)}
.badge{display:inline-block;padding:2px 7px;border-radius:4px;font-size:10px;font-weight:600}
.b-on{background:#166534;color:#86efac}.b-off{background:#7f1d1d;color:#fca5a5}
.b-ses{background:#1e3a5f;color:#93c5fd}.b-regime{background:#312e81;color:#c4b5fd}
.b-warn{background:#713f12;color:#fde68a}.b-cal{background:#4c1d95;color:#ddd6fe}
.controls{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.btn{padding:7px 18px;border:none;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;transition:all .15s}
.btn:hover{opacity:.85;transform:scale(1.02)}
.btn-start{background:var(--green);color:#000}.btn-stop{background:var(--yellow);color:#000}.btn-emergency{background:var(--red);color:#fff}
.btn:disabled{opacity:.3;cursor:not-allowed;transform:none}
table{width:100%;border-collapse:collapse;font-size:11px}
th{text-align:left;color:var(--dim);font-size:9px;text-transform:uppercase;letter-spacing:.5px;padding:3px 5px;border-bottom:1px solid var(--border)}
td{padding:3px 5px;border-bottom:1px solid var(--border)}
.log-box{max-height:260px;overflow-y:auto;font-family:'Cascadia Code','Fira Code',monospace;font-size:10.5px;line-height:1.5}
.log-entry{padding:1px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.log-time{color:var(--dim);margin-right:5px}
.log-tag{font-weight:600;margin-right:5px;min-width:55px;display:inline-block}
.tag-TRADE{color:var(--cyan)}.tag-RESULT{color:var(--green)}.tag-ERR{color:var(--red)}.tag-API{color:var(--purple)}.tag-STATUS{color:var(--blue)}.tag-INIT{color:var(--dim)}.tag-FILTERED{color:var(--yellow)}.tag-SHUTDOWN{color:var(--red)}
.zone-bar{height:5px;border-radius:3px;margin-top:2px}.zone-s{background:var(--green)}.zone-r{background:var(--red)}
.pnl-pos{color:var(--green);font-weight:600}.pnl-neg{color:var(--red);font-weight:600}
.progress{height:5px;background:var(--border);border-radius:3px;overflow:hidden;margin-top:3px}
.progress-fill{height:100%;border-radius:3px;transition:width .3s}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.header h1{font-size:16px;font-weight:700}
.header .meta{font-size:10px;color:var(--dim)}
.pulse{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:5px;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.pulse-on{background:var(--green)}.pulse-off{background:var(--red)}
.ind-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.ind-item{text-align:center;padding:5px;background:rgba(255,255,255,.03);border-radius:4px}
.ind-val{font-size:15px;font-weight:600}.ind-label{font-size:9px;color:var(--dim);margin-top:1px}
.bias-arrow{font-size:20px;font-weight:700}
@media(max-width:768px){
  body{padding:6px}
  .g4,.g3,.g2{grid-template-columns:1fr}
  .controls{flex-wrap:wrap}
  .btn{padding:6px 12px;flex:1 1 auto;min-width:0}
  .header h1{font-size:14px}
  .big{font-size:22px}
  .ind-grid{grid-template-columns:repeat(2,1fr)}
  table{display:block;overflow-x:auto;white-space:nowrap}
  .log-entry{white-space:normal;word-break:break-word}
  #stratBtns{flex-wrap:wrap}
  #stratInfo{display:none}
}
@media(max-width:400px){
  .ind-grid{grid-template-columns:1fr 1fr}
  .btn{font-size:11px;padding:5px 8px}
}
.cfg-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:6px}
.cfg-item{display:flex;flex-direction:column;gap:2px}
.cfg-item label{font-size:9px;text-transform:uppercase;letter-spacing:.5px;color:var(--dim)}
.cfg-item input{background:var(--bg);border:1px solid var(--border);border-radius:4px;padding:4px 6px;color:var(--text);font-size:12px;width:100%}
.cfg-item input:focus{outline:none;border-color:var(--blue)}
.btn-save{background:var(--blue);color:#fff;padding:6px 16px;border:none;border-radius:6px;font-size:11px;font-weight:600;cursor:pointer}
.btn-save:hover{opacity:.85}
</style>
</head>
<body>

<div class="header">
  <h1>&#9889; XAUUSD Auto Trader</h1>
  <div class="meta">
    <button class="theme-btn" id="themeToggle" onclick="toggleTheme()" title="Toggle theme">&#9790;</button>
    <span id="pulse" class="pulse pulse-off"></span>
    <span id="conn">Connecting...</span> | <span id="clocks" style="font-size:10px;letter-spacing:.5px"></span>
    <span style="font-size:10px;color:var(--dim);margin-left:4px">(Daily resets at IST midnight)</span>
  </div>
</div>

<div class="controls">
  <button class="btn btn-start" id="btnStart" onclick="post('/start')">&#9654; START</button>
  <button class="btn btn-stop" id="btnStop" onclick="post('/stop')">&#9632; STOP</button>
  <button class="btn btn-emergency" id="btnEmg" onclick="if(confirm('CLOSE ALL positions and stop?'))post('/emergency')">&#9940; EMERGENCY</button>
  <button class="btn" style="background:#374151;color:#9ca3af" onclick="if(confirm('Shutdown the entire service?'))post('/shutdown')">&#9211; Shutdown</button>
  <div style="flex:1"></div>
  <div id="tradingStatus" style="font-size:14px;font-weight:700"></div>
</div>
<div style="display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:8px;padding:6px 10px;background:var(--card);border:1px solid var(--border);border-radius:8px">
  <span style="font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--dim)">Strategy:</span>
  <div id="stratBtns" style="display:flex;gap:6px"></div>
  <div style="flex:1"></div>
  <span id="stratInfo" style="font-size:11px;color:var(--dim)"></span>
</div>

<div class="card" style="margin-bottom:8px">
  <h3>Risk Config <span id="cfgStatus" style="font-size:10px;color:var(--green);margin-left:8px"></span></h3>
  <div class="cfg-grid" id="cfgGrid"></div>
  <div style="margin-top:8px;text-align:right"><button class="btn-save" onclick="saveConfig()">Save</button></div>
</div>

<div class="grid g4">
  <div class="card"><h3>Price</h3><div id="priceCard">-</div></div>
  <div class="card"><h3>Regime</h3><div id="regimeCard">-</div></div>
  <div class="card"><h3>Bias</h3><div id="biasCard">-</div></div>
  <div class="card"><h3>Calendar</h3><div id="calCard">-</div></div>
</div>

<div class="grid g3">
  <div class="card"><h3>Account</h3><div id="acctCard">-</div></div>
  <div class="card"><h3>Daily P&amp;L</h3><div id="dailyCard">-</div></div>
  <div class="card"><h3>Correlation (DXY / Yields)</h3><div id="corrCard">-</div></div>
</div>

<div class="grid g2">
  <div class="card"><h3>Indicators (M1)</h3><div class="ind-grid" id="indGrid">-</div></div>
  <div class="card"><h3>Zones</h3><div id="zonesCard" style="max-height:180px;overflow-y:auto">-</div></div>
</div>

<div class="grid g2">
  <div class="card"><h3>Open Trades</h3><div id="openT" style="max-height:300px;overflow-y:auto">-</div></div>
  <div class="card"><h3>Closed Trades (MT5 History)</h3><div id="closedT" style="max-height:400px;overflow-y:auto">-</div></div>
</div>

<div class="card"><h3>Live Log</h3><div class="log-box" id="logBox">-</div></div>

<script>
const A=location.origin;
async function get(){
  try{
    const r=await fetch(A+'/status');const d=await r.json();render(d);
    $('pulse').className='pulse pulse-on';$('conn').textContent='Connected';
  }catch(e){$('pulse').className='pulse pulse-off';$('conn').textContent='Disconnected';}
}
async function post(p){try{await fetch(A+p,{method:'POST'});setTimeout(get,200);}catch(e){alert('Failed');}}
function $(id){return document.getElementById(id)}
function pc(v){return v>=0?'pnl-pos':'pnl-neg'}
function ps(v){return(v>=0?'+':'')+v.toFixed(2)}
function esc(s){const d=document.createElement('div');d.textContent=s||'';return d.innerHTML}
function toIST(utcStr){
  if(!utcStr)return'-';
  try{
    let d;
    if(utcStr.includes('T')){d=new Date(utcStr);}// ISO format
    else{const p=utcStr.replace(/\./g,'-').replace(' ','T')+'Z';d=new Date(p);}
    if(isNaN(d))return'-';
    return d.toLocaleTimeString('en',{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false,timeZone:'Asia/Kolkata'});
  }catch(e){return'-';}
}

function render(d){
  const en=d.enabled,tk=d.tick||{},a=d.account||{},rk=d.risk||{},rg=d.regime||{},bi=d.bias||{},co=d.correlation||{},ca=d.calendar||{},ind=d.indicators||{},z=d.zones||{},tr=d.trades||{},st=d.stats||{};
  const price=tk.bid||0;

  // Trading status + strategy buttons
  const mt5=d.mt5_connected!==false;
  const mt5Badge=mt5?'<span class="badge b-on">MT5</span>':'<span class="badge b-off">MT5 DISCONNECTED</span>';
  $('tradingStatus').innerHTML=(en?'<span class="green">TRADING ACTIVE</span>':'<span class="red">TRADING OFF</span>')+' '+mt5Badge;
  const strats=d.strategies||{};
  const avail=strats.available||[];
  const active=strats.active||d.strategy||'';
  const stratDesc={'AUTO':'Best of all strategies | auto-selects highest confidence','SMC_CONFLUENCE':'Swing | MTF bias + zones + sweeps | RR 1.5+','SWEEP_SCALPER':'Scalp | Liquidity sweeps | $3-$6 | London/NY open'};
  $('stratBtns').innerHTML=avail.map(s=>`<button class="btn" style="padding:6px 16px;font-size:12px;font-weight:700;background:${s===active?'var(--purple)':'#1e293b'};color:${s===active?'#fff':'#94a3b8'};border:1px solid ${s===active?'var(--purple)':'var(--border)'}" onclick="post('/strategy/${s}')">${s.replace('_',' ')}</button>`).join('');
  $('stratInfo').textContent=stratDesc[active]||'';
  $('btnStart').disabled=en;$('btnStop').disabled=!en;

  // Price card
  const regState=rg.state||'?';
  const regCol=regState==='TRENDING'?'green':regState==='RANGING'?'yellow':regState==='EXPANSION'?'cyan':'red';
  $('priceCard').innerHTML=`
    <div class="big" style="margin-bottom:4px">${price?price.toFixed(2):'-'}</div>
    <div class="row"><span class="label">Spread</span><span>${tk.spread!=null?tk.spread.toFixed(2):'-'}</span></div>
    <div class="row"><span class="label">Session</span><span class="badge b-ses">${d.session||'-'}</span></div>
    <div class="row"><span class="label">Market</span>${d.market_open?'<span class="badge b-on">OPEN</span>':'<span class="badge b-off">CLOSED</span>'}</div>
    <div class="row"><span class="label">Strategy</span><span class="purple" style="font-weight:600">${d.strategy||'-'}</span></div>
    <div class="row"><span class="label">Cycles</span><span>${st.cycles||0}</span></div>
  `;

  // Regime card
  $('regimeCard').innerHTML=`
    <div style="font-size:18px;font-weight:700;margin-bottom:4px" class="${regCol}">${regState}</div>
    <div class="row"><span class="label">Direction</span><span class="${rg.direction==='LONG'?'green':rg.direction==='SHORT'?'red':'dim'}">${rg.direction||'NEUTRAL'}</span></div>
    <div class="row"><span class="label">ATR Ratio</span><span class="${(rg.atr_ratio||1)>2?'red':(rg.atr_ratio||1)>1.3?'yellow':'green'}">${(rg.atr_ratio||0).toFixed(2)}x</span></div>
    <div class="row"><span class="label">H4 Slope</span><span>${(rg.h4_slope||0).toFixed(3)}</span></div>
    <div class="row"><span class="label">Trade OK</span>${rg.trade_allowed?'<span class="green">YES</span>':'<span class="red">NO</span>'}</div>
    <div style="font-size:10px;color:var(--dim);margin-top:3px">${(rg.reasons||[]).join(' | ')}</div>
  `;

  // Bias card
  const biDir=bi.direction||'NEUTRAL';
  const biCol=biDir==='LONG'?'green':biDir==='SHORT'?'red':'dim';
  const biArrow=biDir==='LONG'?'&#9650;':biDir==='SHORT'?'&#9660;':'&#9644;';
  $('biasCard').innerHTML=`
    <div class="bias-arrow ${biCol}">${biArrow} ${biDir} <span style="font-size:14px">${((bi.confidence||0)*100).toFixed(0)}%</span></div>
    <div class="row"><span class="label">H4 Bias</span><span>${bi.h4_bias||'-'}</span></div>
    <div class="row"><span class="label">H1 Structure</span><span>${(bi.h1_structure||{}).pattern||'-'}</span></div>
    <div class="row"><span class="label">H1 BOS</span>${(bi.h1_structure||{}).bos?'<span class="green">YES '+((bi.h1_structure||{}).bos_direction||'')+'</span>':'<span class="dim">No</span>'}</div>
    <div class="row"><span class="label">M15 Pullback</span>${(bi.m15_pullback||{}).active?'<span class="cyan">'+((bi.m15_pullback||{}).direction||'')+'</span>':'<span class="dim">No</span>'}</div>
    <div style="font-size:10px;color:var(--dim);margin-top:3px">${(bi.reasons||[]).join(' | ')}</div>
  `;

  // Calendar card
  const calBlocked=ca.blocked;
  const nextEv=ca.next_event;
  $('calCard').innerHTML=`
    <div style="font-size:16px;font-weight:700;margin-bottom:4px" class="${calBlocked?'red':'green'}">${calBlocked?'&#9888; BLOCKED':'&#10003; CLEAR'}</div>
    ${calBlocked?'<div class="row"><span class="label">Reason</span><span class="yellow" style="font-size:11px">'+(ca.reason||'')+'</span></div>':''}
    ${nextEv?'<div class="row"><span class="label">Next Event</span><span style="font-size:11px">'+(nextEv.title||'-')+'</span></div>':''}
    ${ca.next_in_min?'<div class="row"><span class="label">In</span><span>'+ca.next_in_min+' min</span></div>':''}
    <div class="row"><span class="label">Events Today</span><span>${ca.events_today||0}</span></div>
  `;

  // Account
  const bal=a.balance||0,eq=a.equity||0,dd=bal>0?((bal-eq)/bal*100):0;
  const fp=d.mt5_floating_pnl||{};
  $('acctCard').innerHTML=`
    <div class="big" style="margin-bottom:4px">$${bal.toFixed(2)}</div>
    <div class="row"><span class="label">Equity</span><span class="${pc(eq-bal)}">$${eq.toFixed(2)}</span></div>
    <div class="row"><span class="label">Floating</span><span class="${pc(fp.total||0)}">${ps(fp.total||0)} (${fp.count||0} pos)</span></div>
    <div class="row"><span class="label">Drawdown</span><span class="${dd>3?'red':dd>1?'yellow':'green'}">${dd.toFixed(1)}%</span></div>
    <div class="row"><span class="label">Leverage</span><span>1:${a.leverage||'-'}</span></div>
  `;

  // Daily
  const tgt=d.daily_target||30;
  const mt5pnl=d.mt5_today_pnl||{};
  // Best P&L source: MT5 deals (single source of truth)
  const dp=mt5pnl.pnl!=null?mt5pnl.pnl:(rk.pnl||0);
  const dt=mt5pnl.trades||rk.trades||0;
  const pnlSrc=mt5pnl.source||'tracker';
  const pct=tgt>0?Math.min(100,Math.max(-100,dp/tgt*100)):0;
  $('dailyCard').innerHTML=`
    <div class="big ${pc(dp)}" style="margin-bottom:3px">$${ps(dp)}</div>
    <div class="progress"><div class="progress-fill" style="width:${Math.abs(pct)}%;background:${dp>=0?'var(--green)':'var(--red)'}"></div></div>
    <div style="font-size:10px;color:var(--dim);margin-top:3px">${pct.toFixed(0)}% of $${tgt}</div>
    <div class="row"><span class="label">Trades</span><span>${dt}</span></div>
    <div class="row"><span class="label">Source</span><span style="font-size:10px;color:var(--dim)">${pnlSrc}</span></div>
    <div class="row"><span class="label">Losses</span><span class="${(rk.consecutive_losses||0)>=3?'red':''}">${rk.consecutive_losses||0} streak</span></div>
    <div class="row"><span class="label">Risk Mult</span><span>${(rk.risk_multiplier||1).toFixed(2)}x</span></div>
    ${rk.target_hit?'<div class="row"><span class="label">Target</span><span class="green">HIT</span></div>':''}
    ${rk.loss_limit_hit?'<div class="row"><span class="label">Loss Limit</span><span class="red">HIT</span></div>':''}
  `;

  // Correlation
  const dxy=co.dxy||{},y10=co.us10y||{};
  const cBias=co.bias||'NEUTRAL';
  const cCol=cBias==='LONG'?'green':cBias==='SHORT'?'red':'dim';
  $('corrCard').innerHTML=`
    <div style="font-size:16px;font-weight:700;margin-bottom:4px" class="${cCol}">Gold bias: ${cBias} ${((co.confidence||0)*100).toFixed(0)}%</div>
    <div class="row"><span class="label">DXY (${dxy.symbol||'-'})</span><span class="${dxy.trend==='UP'?'green':dxy.trend==='DOWN'?'red':'dim'}">${dxy.available?dxy.price+' '+dxy.trend:'N/A'}</span></div>
    <div class="row"><span class="label">US10Y (${y10.symbol||'-'})</span><span class="${y10.trend==='UP'?'green':y10.trend==='DOWN'?'red':'dim'}">${y10.available?y10.price+' '+y10.trend:'N/A'}</span></div>
    <div style="font-size:10px;color:var(--dim);margin-top:3px">${(co.reasons||[]).join(' | ')||'No correlation data'}</div>
  `;

  // Indicators
  const ii=[
    {l:'EMA 9',v:ind.ema9,f:2,c:'cyan'},{l:'EMA 15',v:ind.ema15,f:2,c:'purple'},
    {l:'ATR',v:ind.atr,f:3,c:(ind.atr||0)<0.5?'yellow':'green'},{l:'ATR Ratio',v:ind.atr_ratio,f:2,c:(ind.atr_ratio||1)>1.5?'red':'green'},
    {l:'RSI',v:ind.rsi,f:1,c:(ind.rsi||50)>70?'red':(ind.rsi||50)<30?'green':'blue'},
    {l:'Body',v:ind.body_ratio,f:2},{l:'Slope',v:ind.ema9_slope,f:4,c:(ind.ema9_slope||0)>0?'green':'red'},
    {l:'Gap',v:ind.ema_gap,f:3},
  ];
  $('indGrid').innerHTML=ii.map(i=>`<div class="ind-item"><div class="ind-val ${i.c||''}">${i.v!=null?Number(i.v).toFixed(i.f):'-'}</div><div class="ind-label">${i.l}</div></div>`).join('');

  // Zones
  const sup=z.support||[],res=z.resistance||[];
  let zh='<table><th>Type</th><th>Low</th><th>High</th><th>Str</th><th>T</th>';
  res.slice(0,4).reverse().forEach(z=>{const w=Math.round((z.strength||0)*100);zh+=`<tr><td class="red">R</td><td>${z.zone_low}</td><td>${z.zone_high}</td><td><div class="zone-bar zone-r" style="width:${w}%"></div>${w}%</td><td>${z.touches||0}</td></tr>`;});
  if(price)zh+=`<tr style="background:rgba(255,255,255,.05)"><td colspan="5" style="text-align:center;font-weight:700;color:var(--yellow)">${price.toFixed(2)}</td></tr>`;
  sup.slice(0,4).forEach(z=>{const w=Math.round((z.strength||0)*100);zh+=`<tr><td class="green">S</td><td>${z.zone_low}</td><td>${z.zone_high}</td><td><div class="zone-bar zone-s" style="width:${w}%"></div>${w}%</td><td>${z.touches||0}</td></tr>`;});
  zh+='</table>';$('zonesCard').innerHTML=zh;

  // Open trades — use MT5 positions as source of truth, enrich with trade manager data
  const mt5pos=d.mt5_positions||[];
  const tmTrades=tr.open_trades||[];
  const tmMap={}; tmTrades.forEach(t=>{tmMap[t.ticket]=t;});
  const op=mt5pos.length>0?mt5pos:tmTrades;
  if(!op.length){$('openT').innerHTML='<div style="color:var(--dim);padding:10px;text-align:center">No open trades</div>';}
  else{
  let totalPnl=0;op.forEach(t=>{totalPnl+=(t.net_profit!=null?t.net_profit:(t.live_pnl||0));});
  let h=`<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 8px;margin-bottom:6px;background:rgba(255,255,255,.03);border-radius:4px"><span style="font-size:11px;color:var(--dim)">${op.length} position${op.length>1?'s':''}</span><span style="font-size:15px;font-weight:700" class="${pc(totalPnl)}">Floating: ${ps(totalPnl)}</span></div>`;
  h+='<table><th>#</th><th>Dir</th><th>Lot</th><th>Entry</th><th>SL</th><th>TP</th><th>P&L</th><th>Peak</th><th>Age</th><th>Time</th>';
  op.forEach(t=>{
  const tm=tmMap[t.ticket]||{};
  const dir=t.type||t.direction||'-';
  const pnl=t.net_profit!=null?t.net_profit:(t.live_pnl||0);
  const peak=tm.peak_pnl||0;
  const entry=t.open_price||t.price_open||t.entry||0;
  const sl=t.sl||0;
  const tp=t.tp||0;
  const otime=t.open_time||'';
  const age=tm.fill_ts?Math.round(Date.now()/1000-tm.fill_ts)+'s':'-';
  h+=`<tr><td>${t.ticket}</td><td class="${dir==='BUY'?'green':'red'}" style="font-weight:600">${dir}</td><td>${t.volume}</td><td>${Number(entry).toFixed(2)}</td><td>${sl?Number(sl).toFixed(2):'-'}</td><td>${tp?Number(tp).toFixed(2):'-'}</td><td class="${pc(pnl)}">${ps(pnl)}</td><td class="${pc(peak)}">${ps(peak)}</td><td>${age}</td><td style="font-size:9px"><span class="cyan">U:</span>${otime.includes('T')?otime.split('T')[1]?.substring(0,8):'-'}<br><span class="orange">I:</span>${toIST(otime)}</td></tr>`;});
  h+='</table>';$('openT').innerHTML=h;}

  // Performance summary from MT5 data
  const perf=d.performance||{};
  const perfHtml=perf.total>0?`<div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:6px;padding:6px;background:rgba(255,255,255,.02);border-radius:4px;font-size:11px">
    <span><span class="label">Trades:</span> ${perf.total}</span>
    <span><span class="label">Win Rate:</span> <span class="${(perf.win_rate||0)>=0.5?'green':'red'}">${((perf.win_rate||0)*100).toFixed(1)}%</span></span>
    <span><span class="label">Total P&L:</span> <span class="${pc(perf.total_pnl||0)}">${ps(perf.total_pnl||0)}</span></span>
    <span><span class="label">Avg Win:</span> <span class="green">${ps(perf.avg_win||0)}</span></span>
    <span><span class="label">Avg Loss:</span> <span class="red">-${(perf.avg_loss||0).toFixed(2)}</span></span>
    <span><span class="label">Expectancy:</span> <span class="${pc(perf.expectancy||0)}">${ps(perf.expectancy||0)}</span></span>
    <span><span class="label">Max DD:</span> <span class="red">${(perf.max_drawdown||0).toFixed(2)}</span></span>
  </div>`:'';

  // Closed trades — MT5 deal history, grouped by IST date with daily P&L
  const cl=d.closed_history||[];
  if(!cl.length){$('closedT').innerHTML=perfHtml+'<div style="color:var(--dim);padding:10px;text-align:center">No closed trades</div>';}
  else{
  function parseDate(raw){
    if(!raw)return null;
    try{
      if(raw.includes('T'))return new Date(raw);
      return new Date(raw.replace(/\./g,'-').replace(' ','T')+'Z');
    }catch(e){return null;}
  }
  function fmtUTC(dt){return dt.toLocaleTimeString('en',{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false,timeZone:'UTC'});}
  function fmtIST(dt){return dt.toLocaleTimeString('en',{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false,timeZone:'Asia/Kolkata'});}
  function istDateKey(dt){return dt.toLocaleDateString('en-CA',{timeZone:'Asia/Kolkata'});}
  function istDateLabel(dt){return dt.toLocaleDateString('en',{timeZone:'Asia/Kolkata',year:'numeric',month:'short',day:'numeric',weekday:'short'});}
  const grouped={};
  cl.forEach(t=>{
    const dt=parseDate(t.close_time);
    const key=dt?istDateKey(dt):'unknown';
    if(!grouped[key])grouped[key]={date:key,dateLabel:dt?istDateLabel(dt):key,trades:[],pnl:0,wins:0,losses:0};
    grouped[key].trades.push({...t,_dt:dt});
    grouped[key].pnl+=t.pnl||0;
    if(t.won)grouped[key].wins++;else grouped[key].losses++;
  });
  const days=Object.values(grouped).sort((a,b)=>b.date.localeCompare(a.date));
  let h=perfHtml+'<table><th>#</th><th>Dir</th><th>Vol</th><th>Entry</th><th>Exit</th><th>P&L</th><th>W/L</th><th>Date (IST)</th><th>UTC</th><th>IST</th>';
  days.forEach(day=>{
    const dp=day.pnl;
    h+=`<tr style="background:rgba(255,255,255,.04)"><td colspan="6" style="font-weight:700;font-size:11px;padding:5px">${day.dateLabel}</td><td class="${pc(dp)}" style="font-weight:700;font-size:11px;padding:5px">${ps(dp)}</td><td style="font-size:10px;color:var(--dim);padding:5px">${day.wins}W ${day.losses}L</td><td colspan="2" style="font-size:10px;color:var(--dim);padding:5px">${day.trades.length} trades</td></tr>`;
    day.trades.forEach(t=>{
      const p=t.pnl||0;
      const dt=t._dt;
      const utcTime=dt?fmtUTC(dt):'-';
      const istTime=dt?fmtIST(dt):'-';
      const istDate=dt?istDateKey(dt):'-';
      h+=`<tr><td>${t.ticket}</td><td class="${t.direction==='BUY'?'green':'red'}">${t.direction}</td><td>${t.volume||'-'}</td><td>${t.entry_price?Number(t.entry_price).toFixed(2):'-'}</td><td>${t.exit_price?Number(t.exit_price).toFixed(2):'-'}</td><td class="${pc(p)}">${ps(p)}</td><td>${t.won?'<span class="green">W</span>':'<span class="red">L</span>'}</td><td style="font-size:10px;color:var(--dim)">${istDate}</td><td style="font-size:10px" class="cyan">${utcTime}</td><td style="font-size:10px" class="orange">${istTime}</td></tr>`;
    });
  });
  h+='</table>';$('closedT').innerHTML=h;}

  // Logs
  const logs=d.log||[];
  const lb=$('logBox');
  lb.innerHTML=logs.map(l=>`<div class="log-entry"><span class="log-time"><span class="cyan">${l.time}</span> <span class="orange">${l.time_ist||l.time}</span></span> <span class="log-tag tag-${l.tag}">${l.tag}</span>${esc(l.msg)}</div>`).join('');
  lb.scrollTop=lb.scrollHeight;

  // Risk config
  const rc=d.risk_config||{};
  const cfgLabels={'MAX_POSITIONS':'Max Positions','MAX_RISK_PCT':'Risk %','MAX_DRAWDOWN_PCT':'Max DD %','MAX_LOT':'Max Lot','MIN_LOT':'Min Lot','DAILY_TARGET_DOLLARS':'Daily Target $','DAILY_LOSS_LIMIT_PCT':'Daily Loss %','MAX_CONSECUTIVE_LOSSES':'Max Consec Losses','MIN_TRADE_COOLDOWN':'Trade Cooldown (s)','LOSS_STREAK_PAUSE':'Loss Pause (s)'};
  const cg=$('cfgGrid');
  if(cg && !cg.dataset.init){cg.dataset.init='1';cg.innerHTML=Object.entries(cfgLabels).map(([k,l])=>`<div class="cfg-item"><label>${l}</label><input id="cfg_${k}" data-key="${k}" type="number" step="any" value="${rc[k]||''}"></div>`).join('');}
  else if(cg&&cg.dataset.init){Object.keys(cfgLabels).forEach(k=>{const inp=document.getElementById('cfg_'+k);if(inp&&inp!==document.activeElement)inp.value=rc[k]!=null?rc[k]:'';});}

  document.title=`${ps(dp)} | XAUUSD Auto Trader`;
}

function toggleTheme(){const h=document.documentElement;const t=h.getAttribute('data-theme')==='light'?'dark':'light';h.setAttribute('data-theme',t==='light'?'light':'');localStorage.setItem('theme',t);$('themeToggle').innerHTML=t==='light'?'&#9728;':'&#9790;';}
(function(){const t=localStorage.getItem('theme')||'dark';if(t==='light')document.documentElement.setAttribute('data-theme','light');$('themeToggle').innerHTML=t==='light'?'&#9728;':'&#9790;';})();
function tickClocks(){const o={hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false};const utc=new Date().toLocaleTimeString('en',{...o,timeZone:'UTC'});const ist=new Date().toLocaleTimeString('en',{...o,timeZone:'Asia/Kolkata'});const ldn=new Date().toLocaleTimeString('en',{...o,timeZone:'Europe/London'});const ny=new Date().toLocaleTimeString('en',{...o,timeZone:'America/New_York'});$('clocks').innerHTML='<span class="cyan">UTC</span> '+utc+' &middot; <span class="orange">IST</span> '+ist+' &middot; <span class="blue">LDN</span> '+ldn+' &middot; <span class="orange">NY</span> '+ny;}
setInterval(tickClocks,1000);tickClocks();
async function saveConfig(){
  const inputs=document.querySelectorAll('#cfgGrid input');
  const body={};
  inputs.forEach(inp=>{const v=parseFloat(inp.value);if(!isNaN(v))body[inp.dataset.key]=v;});
  try{const r=await fetch(A+'/config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json();$('cfgStatus').textContent='Saved ✓';setTimeout(()=>$('cfgStatus').textContent='',2000);get();}catch(e){$('cfgStatus').textContent='Failed';$('cfgStatus').style.color='var(--red)';}
}
setInterval(get,500);get();
</script>
</body>
